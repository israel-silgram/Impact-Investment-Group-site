name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Commit/tag to take src/ and public/ from (blank = this branch)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escape hatch: build the site content from an older commit while keeping
      # this branch's build config. Used while main is mid-refactor.
      - name: Take site content from ${{ inputs.source_ref }}
        if: inputs.source_ref != ''
        run: git checkout ${{ inputs.source_ref }} -- src public

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # A CNAME in public/ means the site is served from a custom domain's
      # root, so assets and the router take no path prefix; without one it is a
      # project page under /<repo>/. Derived from the file rather than read off
      # the Pages settings so the build and the domain cannot drift apart: a
      # project-path build served at a domain root 404s every asset on it.
      - name: Resolve base path
        id: base
        run: |
          if [ -f public/CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
            echo "Custom domain $(cat public/CNAME) -> base path /"
          else
            echo "value=${{ steps.pages.outputs.base_path }}/" >> "$GITHUB_OUTPUT"
            echo "Project page -> base path ${{ steps.pages.outputs.base_path }}/"
          fi

      - run: bun install --frozen-lockfile

      # STATIC_BUILD switches vite.config.ts to prerender with no Nitro server.
      - name: Build static site
        env:
          STATIC_BUILD: "true"
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: bun run build

      - name: Rewrite public asset paths, add 404 fallback
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: node scripts/pages-postbuild.mjs dist/client

      # GitHub strips the custom domain on every Actions deploy unless the
      # CNAME travels in the artifact. Vite copies public/ into the output, so
      # this asserts it arrived rather than trusting that it did.
      - name: Verify CNAME survived into the artifact
        run: |
          if [ -f public/CNAME ]; then
            test -f dist/client/CNAME || { echo "CNAME missing from dist/client"; exit 1; }
            echo "CNAME in artifact: $(cat dist/client/CNAME)"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
