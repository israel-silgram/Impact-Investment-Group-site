<?xml version="1.0" encoding="UTF-8"?>
<!-- EPC Register brand mark — the universally-recognised EPC band
     colour bar (A=green, G=red) + wordmark. The band bar IS the
     EPC visual identity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Energy Performance Register">
  <!-- EPC band-rating colour bar -->
  <g transform="translate(96 18)">
    <!-- Bars taper from short (A) to long (G) -->
    <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="11" fill="#FBF8F0">
      <rect x="0" y="0"  width="86"  height="9" rx="1.5" fill="#1D794D" /><text x="6"  y="8">A</text>
      <rect x="0" y="11" width="106" height="9" rx="1.5" fill="#2DA561" /><text x="6"  y="19">B</text>
      <rect x="0" y="22" width="126" height="9" rx="1.5" fill="#7DC243" /><text x="6"  y="30" fill="#062151">C</text>
      <rect x="0" y="33" width="146" height="9" rx="1.5" fill="#F1E83B" /><text x="6"  y="41" fill="#062151">D</text>
      <rect x="0" y="44" width="166" height="9" rx="1.5" fill="#F2B53C" /><text x="6"  y="52" fill="#062151">E</text>
      <rect x="0" y="55" width="186" height="9" rx="1.5" fill="#E58238" /><text x="6"  y="63">F</text>
      <rect x="0" y="66" width="206" height="9" rx="1.5" fill="#D63B2F" /><text x="6"  y="74">G</text>
    </g>
  </g>
  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', system-ui, sans-serif" fill="#062151">
    <text x="220" y="136" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="0.2">Energy Performance</text>
    <text x="220" y="164" text-anchor="middle" font-size="28" font-weight="800" letter-spacing="0.2">Register</text>
    <text x="220" y="186" text-anchor="middle" font-size="10" font-weight="700" fill="#5A6478" letter-spacing="3">UK · GOV.UK · EPC</text>
  </g>
</svg>
